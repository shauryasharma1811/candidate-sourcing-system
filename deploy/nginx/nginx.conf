user  nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush       on;
    tcp_nodelay      on;
    keepalive_timeout  65;
    server_tokens    off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss text/javascript image/svg+xml;

    # Resume uploads are capped at 5MB app-side (MAX_UPLOAD_SIZE_MB); a few
    # MB of headroom here avoids nginx rejecting a request the app itself
    # would have accepted.
    client_max_body_size 8m;

    # Rate-limit zones, applied per-location in conf.d/*.conf.
    #   auth: brute-force protection on login/register/forgot-password
    #   api:  general API abuse protection
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
