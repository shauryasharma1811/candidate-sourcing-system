name: Deploy to Production

# Triggered on pushes to main (after CI passes via branch protection) or
# manually. Tag-based deploys (`v*`) are also supported if you prefer
# release-driven deploys over "every merge to main ships".
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production # requires manual approval if you configure a protection rule on this environment
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/candidate-sourcing-system

            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$IMAGE_TAG
            export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$IMAGE_TAG

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            git pull origin main   # picks up nginx conf / compose file changes

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            # Run migrations before swapping traffic to the new backend.
            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend nginx

            # Wait for the new backend to report healthy before declaring success.
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -fsS http://localhost:8000/health; then
                echo "Backend healthy."
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Backend failed health check after deploy — see logs." >&2
                docker compose -f docker-compose.prod.yml logs --tail=100 backend
                exit 1
              fi
              sleep 5
            done

            docker image prune -f

      - name: Notify on failure
        if: failure()
        run: echo "Deploy failed — check the Actions log and server logs (docker compose logs) before retrying."
