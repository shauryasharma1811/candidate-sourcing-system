version: "3.9"

# Production stack. Differences from docker-compose.yml (dev):
#   - builds Dockerfile.prod (gunicorn / standalone Next.js, non-root users)
#   - no source bind-mounts, no --reload / npm dev server
#   - backend & frontend are NOT published on host ports — only nginx is;
#     everything else talks over the internal `backend_net` network
#   - nginx terminates TLS and proxies to both services
#   - certbot renews Let's Encrypt certs into a shared volume nginx reads
#   - restart: always (vs unless-stopped) so a host reboot brings the
#     stack back without manual intervention
#
# Usage:
#   cp backend/.env.production.example backend/.env.production
#   cp frontend/.env.production.example frontend/.env.production
#   docker compose -f docker-compose.prod.yml up -d --build
#
# First-run TLS cert issuance (see deploy/README.md for the full sequence):
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#     --webroot -w /var/www/certbot -d your-domain.com -d www.your-domain.com

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: ./backend/.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/postgres/backups:/backups
    networks: [backend_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  # Remove this service entirely if using a managed object store (S3,
  # DigitalOcean Spaces, Cloudflare R2, etc.) in production instead of
  # self-hosted MinIO — just point S3_ENDPOINT_URL/keys at that provider
  # in backend/.env.production and delete the `minio:` block below.
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    env_file: ./backend/.env.production
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [backend_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-css-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file: ./backend/.env.production
    depends_on:
      db: { condition: service_healthy }
    networks: [backend_net]
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker
             --workers 4 --bind 0.0.0.0:8000 --timeout 60 --graceful-timeout 30
             --keep-alive 5 --preload --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 768m }

  frontend:
    image: ${FRONTEND_IMAGE:-css-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: always
    env_file: ./frontend/.env.production
    depends_on:
      backend: { condition: service_healthy }
    networks: [backend_net]
    deploy:
      resources:
        limits: { memory: 512m }

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks: [backend_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Runs `certbot renew` on a loop and exits/sleeps; nginx picks up
  # renewed certs on its own periodic reload (see deploy/README.md for
  # the cron/systemd-timer snippet that reloads nginx after renewal).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
             certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!};
             done"

networks:
  backend_net:
    driver: bridge

volumes:
  db_data:
  minio_data:
  certbot_www:
  certbot_certs:
